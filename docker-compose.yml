services:
  scylla:
    image: scylladb/scylla:5.4
    command: ["--smp", "1", "--memory", "750M", "--overprovisioned", "1"]
    ports:
      - "9042:9042"
    volumes:
      - scylla-data:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "cqlsh $(hostname -i | awk '{print $1}') 9042 -e 'DESCRIBE KEYSPACES' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 3s
      retries: 30

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      SERVER_BIND_ADDR: 0.0.0.0:50051
      SCYLLA_URI: scylla:9042
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      RUST_LOG: info
    ports:
      - "50051:50051"
    depends_on:
      scylla:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        FRONTEND_BACKEND_URL: http://127.0.0.1:50051
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  scylla-data:
  clickhouse-data:
